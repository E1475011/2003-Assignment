{% extends "wrapper.html" %}

{% block head %}
   <title>Select Question</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 40px;
       }

      .container {
        max-width: 600px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
          text-align: center;
          color: #333;
      }
     ul {
          list-style-type: none;
          padding: 0;
      }
     li {
          margin: 12px 0;
      }
     a {
        text-decoration: none;
        background-color: #4285f4;
        color: white;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        display: inline-block;
        transition: background-color 0.3s ease;
      }
    
    a:hover {
       background-color: #3367d6;
    }
    
    .back-button {
        margin-top: 30px;
        display: flex;
        justify-content: center;
    }

    .back-button input {
        background-color: #aaa;
        color: white;
        padding: 12px;
        font-size: 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .back-button input:hover {
        background-color: #888;
    }

    .btn{
      width: 100%;
      background-color: seashell;
      color: black;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
     }

    .btn:hover {
      background-color: #3367d6;
     }

  </style>
{% endblock %}

{% block body %}
<h2>Assessments</h2>
<h2 id="parameter" hidden>{{parameter}}</h2>
<h2 id="questions" hidden>{{questions}}</h2>
<h2 id="titles" hidden>{{titles}}</h2>
<ul>
    <div id="body"></div>
    
    {% for question in questions %}
        <li>
            <a href="{{parameter}}question?question_no={{question}}" id="link">{{titles[loop.index0]}}</a>
        </li>
    {% endfor %}
<ul>

<form action="/home" method="GET">
    <input type="submit" class="btn" value="Go back">
  </form>
{% endblock %}
