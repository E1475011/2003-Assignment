{% extends "wrapper.html" %}

{% block head %}
   <title>Select Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            margin: 0;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        li {
            margin: 12px 0;
        }

        a {
            display: inline-block;
            background-color: #4285f4;
            color: white;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 6px;
            text-decoration: none;
            min-width: 220px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #3367d6;
        }

        form {
            text-align: center;
            margin-top: 30px;
        }

        input[type="submit"] {
            background-color: #999;
            color: white;
            padding: 10px 30px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            min-width: 180px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #777;
        }
    </style>
{% endblock %}

{% block body %}
<h2>Assessments</h2>
<h2 id="parameter" hidden>{{parameter}}</h2>
<h2 id="questions" hidden>{{questions}}</h2>
<h2 id="titles" hidden>{{titles}}</h2>
<ul>
    <div id="body"></div>
    
    {% for question in questions %}
        <li>
            <a href="{{parameter}}question?question_no={{question}}" id="link">{{titles[loop.index0]}}</a>
        </li>
    {% endfor %}
<ul>

<form action="/home" method="GET">
    <input type="submit" class="btn" value="Go back">
  </form>
{% endblock %}
