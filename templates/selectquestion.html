{% extends "wrapper.html" %}

{% block head %}
<title>Select Question</title>
<style>
  table, th, td {
    border: 1px solid;
    border-collapse: collapse;
  }
</style>
{% endblock %}

{% block body %}
<h2>Select question </h2>
<h2 id="parameter" hidden>{{parameter}}</h2>
<table>
    <div id="questions"></div>
    <script>
        // JavaScript array
        let data = ["Question 1", "Question 2",
            "Question 3", "Question 4"];

        // Get the list container element
        let list =
            document.getElementById('questions');

        // Create the unordered list element 
        //and set its inner HTML using map() and join()
        let parameter = document.getElementById('parameter').innerHTML
        let ul = `<ul>${data.map(question =>
            `<li>
                <a href="${parameter}question?question_no=${question}" id="link">${question}</a>
            </li>
            `).join('')}
                  </ul>`;

        // Set the inner HTML of the list container
        list.innerHTML = ul;
    </script>
</table>

<form action="/home" method="GET">
    <input type="submit" value="Go Back">
</form>
{% endblock %}
