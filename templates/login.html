{% extends "wrapper.html" %}

{% block head %}
  <title>Login</title>
  <style>
    body {
       font-family: Arial, sans-serif;
       background-color: #f4f4f4;
       margin: 0;
       padding: 40px;
    }

    .login-container {
       max-width: 400px;
       margin: 80px auto;
       background-color: white;
       padding: 30px;
       border-radius: 8px;
       box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
     }

    h2 {
       text-align: center;
       color: #333;
    }
    
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      background-color: #4285f4;
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
     }

    .btn:hover {
      background-color: #3367d6;
     }

    .error-message {
      color: red;
      text-align: center;
      margin-top: 15px;
     }
 </style>
{% endblock %}

{% block body %}
<div class="login-container">
  <h2>Login</h2>
  <form action="/home" method="POST">
    <div class="form-group">
      <label for="loginId">Login ID:</label>
      <input type="text" id="loginId" name="loginId" required>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
      <button type="submit" class="btn">Submit</button>
    </div>
  </form>
{% if error %}
<p1>{{error}}</p1>
{% endif %}
</div>
{% endblock %}
