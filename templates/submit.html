{% extends "wrapper.html" %}

{% block head %}
<title>Submit</title>
<style>
    #userinput {
        width: 1000px;
        height: 500px;
        font-size: 16px;
        padding: 8px;
        box-sizing: border-box;
    }
</style>
{% endblock %}

{% block body %}
    <h2>Submit Your Answer</h2>
    <h3>Assessment Id: {{assessment["aid"]}}</h3>
    <h3>Title: {{assessment["title"]}}</h3>
    <h3>Due Date: {{assessment["due_date"]}}</h3>
    <h3>Test grade: {{grade}}</h3>

    <form method="POST" formaction="/submit"></form>
        {% for task in tasks % }
            <label for="userinput_{{loop.index}}">Task{{loop.index}}:</label><br>
            <textarea id="userinput_{{loop.index}}" name ="userinput_{{loop.index}}" rows="10" cols="100" required></textarea><br><br>
            <!--<input type="text" id="userinput" name="userinput" required><br><br>-->
        {% endfor %}
            <input type="submit" value="Submit">
    </form>
{% endblock %}
