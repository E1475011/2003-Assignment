{% extends "wrapper.html" %}

{% block head %}
<title>Submit</title>
<style>
    #userinput {
        width: 1000px;
        height: 500px;
        font-size: 16px;
        padding: 8px;
        box-sizing: border-box;
    }
</style>
{% endblock %}

{% block body %}
    <h2>Submit Your Answer</h2>
    <h3>Assessment Id: {{assessment["aid"]}}</h3>
    <h3>Title: {{assessment["title"]}}</h3>
    <h3>Due Date: {{assessment["due_date"]}}</h3>
    <form method="POST" formaction="/submit">
        <label for="userinput">Your Answer:</label>
        <input type="text" id="userinput" name="userinput" required><br><br>
        <input type="submit" value="Submit">

        <!--<input type="submit" formaction="/home" value="Go back to homepage">
        <input type="submit" formaction="/submit" value="Select another question"> -->

    </form>
{% endblock %}
