{% extends "wrapper.html" %}

{% block head %}
<title>Submit</title>
<style>
    textarea {
        width: 600px;
        height: 400px;
        font-size: 16px;
        padding: 8px;
        box-sizing: border-box;
    }
</style>
{% endblock %}

{% block body %}
    <h2>Submit Your Answer</h2>
    <h3>Assessment Id: {{assessment["aid"]}}</h3>
    <h3>Title: {{assessment["title"]}}</h3>
    <h3>Due Date: {{assessment["due_date"]}}</h3>

    <form method="POST" action="/submitquestion">
        {% for task in tasks %}
            <label for="userinput_{{ loop.index }}">Task {{ loop.index }}: {{ task[1] }}</label><br>
            <input type="text" id="userinput_{{ loop.index }}" name="code" required><br><br>
            <input type="hidden" name="tid" value="{{task[0]}}">
        {% endfor %}  
        <input type="submit" value="Submit">
    </form>

    <form action="/submit" method="GET">
        <input type="submit" value="Go Back">
    </form>

{% endblock %}
